name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests, lint, and build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain \
            2>&1 | tee "$RUNNER_TEMP/younispin-build.log"

      - name: Upload APK and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: younispin-debug-build
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
            ${{ runner.temp }}/younispin-build.log
